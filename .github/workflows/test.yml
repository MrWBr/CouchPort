name: Testes

on: [push, pull_request]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python3 tests/e2e.py
      - name: Sintaxe dos scripts
        run: |
          for f in extension/*.js; do node --check "$f" 2>/dev/null || node --input-type=module --check < "$f"; done
          bash -n linux/couchport && bash -n linux/install.sh
